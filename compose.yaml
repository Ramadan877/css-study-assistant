services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: css_assistant
      POSTGRES_USER: css_user
      POSTGRES_PASSWORD: "${CSS_DB_PASSWORD}:?Set CSS_DB_PASSWORD in .env"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - css_postgres_data:/var/lib/postgresql/data

volumes:
  css_postgres_data: